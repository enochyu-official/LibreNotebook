<h3 class='sectionHead' id='different-parameterizations-of-curves'>
<span class='titlemark'>0.1</span> <a id='x1-10000.1'></a>Different
Parameterizations of Curves</h3><!-- l. 7 -->

<p class='noindent'>As you could have noticed from the previous
section, there are many different ways to represent a curve. In this
section, we will discuss another method that uses the length of arc
of a curve.</p>
